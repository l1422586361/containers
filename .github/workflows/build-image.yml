name: Build Image to Remote

on:
  push:
    branches: [ "test-dockerbuild","mongodb-5.0.9-build" ]
  pull_request:
    branches: [ "test-dockerbuild" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Git pull
      uses: actions/checkout@v3
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2.9.1

    - name: Login to Docker Hub
      uses: docker/login-action@v2.2.0
      with:
        # registry: registry.cn-hangzhou.aliyuncs.com
        # username: beiFeng_l
        # password: 123!@#qwe
        registry: swr.cn-north-4.myhuaweicloud.com
        username: cn-north-4@HST3W8SQSEWIYJMEONOD
        password: fbd09ff320c93a615a9a4ff1c7a32d92e66b0d3b5613dc62e92216a6fd52006a
        logout: false

    - name: Build and Push
      uses: docker/build-push-action@v3
      with:
          context: bitnami/mongodb/5.0/debian-11
          # file: qdrant/Dockerfile
          # file: ./Dockerfile.ssh-agent
          file: bitnami/mongodb/5.0/debian-11/Dockerfile.arm64
          push: true
          # https://blog.csdn.net/wmdscjhdpy/article/details/125454672
          # platforms: linux/amd64
          platforms: linux/arm64
          tags: swr.cn-north-4.myhuaweicloud.com/public123/mongodb:5.0.9.jq-by-arm64
          outputs: type=oci
          # tags: registry.cn-hangzhou.aliyuncs.com/public123/ssh-agent:0.4
          # tags: registry.cn-hangzhou.aliyuncs.com/public123/qdrant:v1.14.0-multiling-2
